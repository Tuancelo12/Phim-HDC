name: Build PhimHDCSS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: PhimHDCSS-Android-Project/PhimHDCSS
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhimHDCSS-debug-apk
          path: PhimHDCSS-Android-Project/PhimHDCSS/app/build/outputs/apk/debug/*.apk
