name: Build PhimHDCSS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhimHDCSS-Android-Project/PhimHDCSS/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PhimHDCSS-Android-Project/PhimHDCSS

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhimHDCSS-debug-apk
          path: PhimHDCSS-Android-Project/PhimHDCSS/app/build/outputs/apk/debug/*.apk
